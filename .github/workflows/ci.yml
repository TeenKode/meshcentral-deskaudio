name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm test

  # Rebuild the native Windows helpers from source and make sure the committed
  # binaries are exactly what the source produces (the build is reproducible on
  # a pinned toolchain).
  native:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install MinGW-w64
        run: sudo apt-get update -qq && sudo apt-get install -y -qq g++-mingw-w64-x86-64 g++-mingw-w64-i686
      - name: Build helpers
        run: sh helpers/build-native.sh
      - name: Committed helpers match the source
        run: |
          if ! git diff --quiet -- helpers/deskaudio-x64.exe helpers/deskaudio-x86.exe; then
            echo "::error::helpers/*.exe differ from win-loopback-native.cpp — run helpers/build-native.sh on Ubuntu 24.04 and commit the result"
            exit 1
          fi
      # Uploaded so the binaries can be fetched and committed when the source
      # legitimately changes (this runner has the exact pinned toolchain).
      - name: Upload rebuilt helpers
        uses: actions/upload-artifact@v4
        with:
          name: rebuilt-helpers
          path: |
            helpers/deskaudio-x64.exe
            helpers/deskaudio-x86.exe
          if-no-files-found: error

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck helpers/*.sh

  # The resampler quality gate: build the host test with g++ and run it. Checks
  # passband fidelity and anti-alias suppression for 48k and 44.1k -> 16k,
  # and that streaming in odd-sized pieces matches one-shot resampling.
  resampler:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and run the resampler test
        run: |
          cc -O2 -Wall -o /tmp/resample-test helpers/resample-test.c -lm
          /tmp/resample-test
